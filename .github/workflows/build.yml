name: Build Sentia APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sentia-release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/sentia-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found. APK will be signed with your key."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set. APK will be signed with the debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Sentia-v${VER}.apk"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -n 1)
          "$APKSIGNER" verify --print-certs "out/Sentia-v${VER}.apk" | head -n 3 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sentia-v${{ steps.apk.outputs.ver }}
          path: out/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk