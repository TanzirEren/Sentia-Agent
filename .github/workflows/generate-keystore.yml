name: Generate signing keystore (run once)

# Run this manually ONCE. It creates your release keystore and strong random passwords,
# then uploads them as a private artifact (kept 1 day). Download it, copy the 4 values into
# GitHub Secrets, keep the .jks file somewhere safe, then delete this run and its artifact.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          mkdir -p out
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)
          ALIAS=sentia
          keytool -genkeypair -v \
            -keystore out/sentia-release.jks -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Sentia, OU=Sentia, O=Sentia, C=BD"
          base64 -w0 out/sentia-release.jks > out/keystore-base64.txt
          {
            echo "Add these 4 repository secrets (Settings > Secrets and variables > Actions):"
            echo
            echo "SIGNING_KEYSTORE_BASE64 = (the full content of keystore-base64.txt)"
            echo "SIGNING_STORE_PASSWORD  = $PASS"
            echo "SIGNING_KEY_ALIAS       = $ALIAS"
            echo "SIGNING_KEY_PASSWORD    = $PASS"
          } > out/secrets.txt

      - name: Upload (private, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: sentia-signing-KEEP-PRIVATE
          path: out/*
          retention-days: 1
